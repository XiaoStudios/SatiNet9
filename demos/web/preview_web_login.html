<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sati Net Last</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        /* Replica de sati_design.css relevante */
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar — igual que _Layout.cshtml */
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .nav-link.disabled-nav {
            color: rgba(255,255,255,0.35) !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Contenedor principal */
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 28px;
        }

        .sati-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .sati-input-control {
            padding: 10px !important;
            border: 2px solid #dee2e6 !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            width: 100%;
            box-sizing: border-box;
        }

        .sati-input-control:focus {
            outline: none !important;
            border-color: #5a67d8 !important;
            box-shadow: 0 0 0 3px rgba(90,103,216,0.15) !important;
        }

        .sati-load-btn {
            width: 100%;
            padding: 11px 15px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            background: #5a67d8;
            color: white;
            transition: background 0.2s;
            cursor: pointer;
        }

        .sati-load-btn:hover {
            background: #4c51bf;
        }

        .error-msg {
            display: none;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 16px;
        }

        footer {
            background: #212529;
            color: rgba(255,255,255,0.65);
            text-align: center;
            padding: 14px;
            font-size: 13px;
        }

        /* Badge de preview */
        .preview-badge {
            position: fixed;
            top: 70px;
            right: 16px;
            background: #5a67d8;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            opacity: 0.85;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Navbar — mismo diseño que _Layout.cshtml -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sati Net Last</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Menús deshabilitados hasta que el usuario inicie sesión -->
                    <li class="nav-item">
                        <a class="nav-link disabled-nav" href="#" title="Inicia sesión para acceder">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled-nav" href="#" title="Inicia sesión para acceder">Sati Trader</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled-nav" href="#" title="Inicia sesión para acceder">Excel Page</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled-nav" href="#" title="Inicia sesión para acceder">History MT</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <span class="preview-badge">DEMO / PREVIEW</span>

    <!-- Login centrado -->
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Trading Platform — Sati Net Last</p>

            <div class="error-msg" id="errorMsg">
                Usuario o contraseña incorrectos.
            </div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="sati-label" for="username">Usuario</label>
                    <input type="text" id="username" class="sati-input-control" placeholder="Ingresa tu usuario" autocomplete="username" />
                </div>

                <div class="mb-4">
                    <label class="sati-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="sati-input-control" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
                </div>

                <button type="submit" class="sati-load-btn">Ingresar</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 - Sati Net Last - Trading Platform
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Preview: redirige directo al index (sin validación real)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            // En el preview simplemente redirige al index
            // En producción: POST /Account/Login → valida contra Admin_Users en DB
            window.location.href = 'preview_web_index.html';
        });
    </script>
</body>
</html>
